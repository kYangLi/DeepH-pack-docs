name: Create draft release

# Triggered when a version tag (v*) is pushed to the public GitHub repository.
# Verifies the tag matches the project version, then creates a DRAFT GitHub Release.
# Nothing is published to PyPI here: a maintainer reviews the draft and clicks
# "Publish release", which triggers publish.yaml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG pyproject=$VER"
          [ "$TAG" = "$VER" ] || { echo "::error::tag $TAG does not match pyproject version $VER"; exit 1; }

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
